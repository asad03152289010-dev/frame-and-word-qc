<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame &amp; Word — Video Spelling QC</title>
<style>
  :root{
    --ink:#1c1f1a;
    --paper:#f6f5f0;
    --line:#d8d5c9;
    --mark:#c65d2e;
    --mark-dim:#e9c3ac;
    --ok:#3f6b4a;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --serif: "Source Serif Pro", Georgia, serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--serif); line-height:1.5;
  }
  header{
    padding:2.5rem 1.5rem 1.5rem; max-width:880px; margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:2rem; margin:0 0 .25rem; font-weight:600; letter-spacing:-.01em;
  }
  header h1 .mark{ color:var(--mark); }
  header p{ margin:0; color:#5b5a52; font-family:var(--mono); font-size:.85rem; }

  main{ max-width:880px; margin:0 auto; padding:2rem 1.5rem 4rem; }

  .dropzone{
    border:2px dashed var(--line); border-radius:2px; padding:2.5rem 1.5rem;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
    background:#fdfdfb;
  }
  .dropzone.drag{ border-color:var(--mark); background:#fbf1ea; }
  .dropzone p{ margin:.25rem 0; }
  .dropzone .big{ font-size:1.05rem; }
  .dropzone .small{ font-family:var(--mono); font-size:.8rem; color:#8a887c; }
  input[type=file]{ display:none; }

  #filelist{ margin-top:1rem; font-family:var(--mono); font-size:.85rem; }
  #filelist .row{ display:flex; justify-content:space-between; padding:.3rem 0; border-bottom:1px solid var(--line); }

  .options{ margin-top:1.5rem; display:grid; gap:1rem; grid-template-columns:1fr 1fr; }
  .field label{ display:block; font-family:var(--mono); font-size:.75rem; text-transform:none; color:#5b5a52; margin-bottom:.35rem; }
  .field input, .field textarea{
    width:100%; font-family:var(--mono); font-size:.85rem; padding:.5rem .6rem;
    border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink);
  }
  .field textarea{ min-height:64px; resize:vertical; }

  button.run{
    margin-top:1.5rem; font-family:var(--mono); font-size:.9rem; padding:.7rem 1.4rem;
    background:var(--ink); color:var(--paper); border:none; border-radius:2px; cursor:pointer;
  }
  button.run:disabled{ opacity:.4; cursor:default; }
  button.run:hover:not(:disabled){ background:var(--mark); }

  #results{ margin-top:2.5rem; }
  .video-block{ margin-bottom:2rem; border:1px solid var(--line); background:#fdfdfb; }
  .video-block .vhead{
    display:flex; justify-content:space-between; align-items:center;
    padding:.75rem 1rem; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:.85rem;
  }
  .video-block .vname{ font-weight:600; }
  .status-badge{ font-family:var(--mono); font-size:.7rem; padding:.15rem .5rem; border-radius:10px; }
  .status-queued{ background:#eee; color:#777; }
  .status-processing{ background:#fdeacb; color:#8a5a12; }
  .status-done{ background:#dcebe0; color:var(--ok); }
  .status-error{ background:#fbdcd3; color:#a1341a; }

  .flag{ display:flex; gap:1rem; padding:1rem; border-bottom:1px solid var(--line); }
  .flag:last-child{ border-bottom:none; }
  .flag img{ width:120px; height:auto; border:1px solid var(--line); flex-shrink:0; }
  .flag-meta{ font-family:var(--mono); font-size:.8rem; color:#5b5a52; }
  .flag-time{ color:var(--mark); font-weight:600; }
  .flag-words{ margin:.35rem 0; }
  .flag-words span{
    display:inline-block; background:var(--mark-dim); color:#7a3316; padding:.1rem .45rem;
    margin:0 .3rem .3rem 0; border-radius:2px; font-size:.78rem;
  }
  .flag-text{ font-family:var(--serif); font-size:.9rem; color:#333; }

  .no-flags{ padding:1rem; font-family:var(--mono); font-size:.85rem; color:var(--ok); }

  .csv-link{ font-family:var(--mono); font-size:.8rem; }
  .csv-link a{ color:var(--mark); }
</style>
</head>
<body>
<header>
  <h1>Frame &amp; <span class="mark">Word</span></h1>
  <p>on-screen text QC — upload, we OCR every frame and flag the typos</p>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <p class="big">Drop video files here, or click to browse</p>
    <p class="small">MP4, MOV, MKV, AVI, WEBM — multiple files at once</p>
    <input type="file" id="fileInput" multiple accept=".mp4,.mov,.mkv,.avi,.webm,.m4v">
  </div>
  <div id="filelist"></div>

  <div class="options">
    <div class="field">
      <label>Sample rate (frames / second)</label>
      <input type="number" id="fps" value="1" min="0.2" max="5" step="0.2">
    </div>
    <div class="field">
      <label>Allow-list (one word per line — names, brands, jargon)</label>
      <textarea id="allowlist" placeholder="e.g.
Anthropic
Kazim"></textarea>
    </div>
  </div>

  <button class="run" id="runBtn" disabled>Run QC</button>

  <div id="results"></div>
</main>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filelist = document.getElementById('filelist');
const runBtn = document.getElementById('runBtn');
const results = document.getElementById('results');
let selectedFiles = [];

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(fileArr){
  selectedFiles = Array.from(fileArr);
  filelist.innerHTML = selectedFiles.map(f =>
    `<div class="row"><span>${f.name}</span><span>${(f.size/1024/1024).toFixed(1)} MB</span></div>`
  ).join('');
  runBtn.disabled = selectedFiles.length === 0;
}

runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  runBtn.textContent = 'Uploading…';
  const fd = new FormData();
  selectedFiles.forEach(f => fd.append('videos', f));
  fd.append('fps', document.getElementById('fps').value);
  fd.append('allowlist', document.getElementById('allowlist').value);

  const res = await fetch('/upload', { method: 'POST', body: fd });
  const data = await res.json();
  if (data.error) { alert(data.error); runBtn.disabled = false; runBtn.textContent = 'Run QC'; return; }

  runBtn.textContent = 'Processing…';
  pollStatus(data.job_id);
});

function pollStatus(jobId){
  const interval = setInterval(async () => {
    const res = await fetch(`/status/${jobId}`);
    const job = await res.json();
    renderResults(jobId, job);
    if (job.status === 'done') {
      clearInterval(interval);
      runBtn.textContent = 'Run QC';
      runBtn.disabled = false;
    }
  }, 2000);
}

function renderResults(jobId, job){
  let html = `<div class="csv-link"><a href="/reports/${jobId}/report.csv" download>↓ download full CSV report</a></div>`;
  for (const [vname, vdata] of Object.entries(job.videos)) {
    html += `<div class="video-block">
      <div class="vhead">
        <span class="vname">${vname}</span>
        <span class="status-badge status-${vdata.status}">${vdata.status}</span>
      </div>`;
    if (vdata.status === 'done') {
      if (vdata.flags.length === 0) {
        html += `<div class="no-flags">no spelling issues flagged ✓</div>`;
      } else {
        vdata.flags.forEach(flag => {
          html += `<div class="flag">
            ${flag.thumb ? `<img src="${flag.thumb}">` : ''}
            <div class="flag-meta">
              <div class="flag-time">${flag.start} – ${flag.end}</div>
              <div class="flag-words">${flag.words.map(w => `<span>${w}</span>`).join('')}</div>
              <div class="flag-text">${flag.text}</div>
            </div>
          </div>`;
        });
      }
    } else if (vdata.status === 'error') {
      html += `<div class="no-flags" style="color:#a1341a">error: ${vdata.error || 'unknown'}</div>`;
    }
    html += `</div>`;
  }
  results.innerHTML = html;
}
</script>
</body>
</html>
