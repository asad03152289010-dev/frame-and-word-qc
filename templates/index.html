<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame &amp; Word — Video Spelling QC</title>
<style>
  :root{
    --bg:#0e0f11;
    --panel:#17181b;
    --panel-2:#1e2024;
    --line:#2a2c30;
    --accent:#5b8def;
    --accent-dim:#1c2c45;
    --text:#e8e8ea;
    --text-dim:#8b8d94;
    --ok:#3ecf8e;
    --ok-dim:#123326;
    --warn:#f0a942;
    --sans: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.5;
  }
  header{
    padding:1.25rem 2rem; max-width:1040px; margin:0 auto;
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:.75rem;
  }
  header h1{
    font-size:1.15rem; margin:0; font-weight:600; letter-spacing:-.01em;
  }
  header h1 .mark{ color:var(--accent); }
  header p{ margin:0; color:var(--text-dim); font-size:.82rem; }

  main{ max-width:1040px; margin:0 auto; padding:2rem 2rem 4rem; }

  .dropzone{
    border:1px solid var(--line); border-radius:8px; padding:3rem 1.5rem;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
    background:var(--panel);
  }
  .dropzone.drag{ border-color:var(--accent); background:var(--accent-dim); }
  .dropzone p{ margin:.25rem 0; }
  .dropzone .big{ font-size:1rem; color:var(--text); }
  .dropzone .small{ font-size:.78rem; color:var(--text-dim); margin-top:.4rem; }
  #fileInput{ display:none; }
  input[type=file]{ color:var(--text); font-size:.8rem; }
  input[type=file]::file-selector-button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:.4rem .8rem; margin-right:.6rem; cursor:pointer; font-size:.8rem;
  }

  #filelist{ margin-top:1rem; font-size:.85rem; }
  #filelist .row{
    display:flex; justify-content:space-between; padding:.6rem .9rem;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:.4rem;
  }

  .options{ margin-top:1.5rem; display:grid; gap:1rem; grid-template-columns:1fr 1fr; }
  .field label{ display:block; font-size:.78rem; color:var(--text-dim); margin-bottom:.4rem; }
  .field input, .field textarea, .field select{
    width:100%; font-family:var(--sans); font-size:.85rem; padding:.55rem .7rem;
    border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--text);
  }
  .field select{ cursor:pointer; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ min-height:64px; resize:vertical; font-family:var(--mono); }

  .section-title{
    margin:3rem 0 1rem; font-size:.8rem; font-weight:600; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:.04em; padding-top:1.5rem; border-top:1px solid var(--line);
  }
  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:.75rem 1rem; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; margin-bottom:.5rem; font-size:.83rem;
  }
  .history-item .h-left{ display:flex; flex-direction:column; gap:.2rem; }
  .history-item .h-video{ font-weight:600; }
  .history-item .h-meta{ font-size:.75rem; color:var(--text-dim); }
  .history-item .h-flags{ font-size:.78rem; color:var(--warn); }
  .history-item a{ color:var(--accent); text-decoration:none; font-size:.78rem; }
  .history-item a:hover{ text-decoration:underline; }
  .history-empty{ font-size:.83rem; color:var(--text-dim); }

  button.run{
    margin-top:1.5rem; font-size:.85rem; font-weight:600; padding:.65rem 1.5rem;
    background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer;
  }
  button.run:disabled{ opacity:.35; cursor:default; }
  button.run:hover:not(:disabled){ background:#4a7ce0; }

  .progress-wrap{ margin-top:1rem; font-size:.8rem; color:var(--text-dim); }
  .progress-bar{ height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-top:.4rem; }
  .progress-fill{ height:100%; background:var(--accent); width:0%; transition:width .2s; }
  .error-box{
    margin-top:1rem; padding:.75rem 1rem; background:#3a1a1a; color:#f5a3a3;
    font-size:.82rem; border-radius:6px; border:1px solid #5c2626;
  }

  #results{ margin-top:2.5rem; }
  .video-block{
    margin-bottom:1.5rem; border:1px solid var(--line); background:var(--panel); border-radius:8px; overflow:hidden;
  }
  .video-block .vhead{
    display:flex; justify-content:space-between; align-items:center;
    padding:.9rem 1.2rem; border-bottom:1px solid var(--line); background:var(--panel-2);
  }
  .video-block .vname{ font-weight:600; font-size:.9rem; }
  .status-badge{ font-size:.68rem; font-weight:600; padding:.2rem .6rem; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; }
  .status-queued{ background:var(--panel-2); color:var(--text-dim); }
  .status-processing{ background:#3a2c10; color:var(--warn); }
  .status-done{ background:var(--ok-dim); color:var(--ok); }
  .status-error{ background:#3a1a1a; color:#f5a3a3; }

  .flag{ display:flex; gap:1.1rem; padding:1.1rem 1.2rem; border-bottom:1px solid var(--line); }
  .flag:last-child{ border-bottom:none; }
  .flag img{ width:130px; height:auto; border-radius:6px; border:1px solid var(--line); flex-shrink:0; }
  .flag-meta{ font-size:.82rem; color:var(--text-dim); }
  .flag-time{ color:var(--accent); font-weight:600; font-family:var(--mono); font-size:.78rem; }
  .flag-words{ margin:.5rem 0; }
  .flag-words span{
    display:inline-block; background:#3a2317; color:#f0a97a; padding:.15rem .55rem;
    margin:0 .3rem .3rem 0; border-radius:4px; font-size:.76rem; font-weight:600;
  }
  .flag-text{ font-size:.85rem; color:var(--text); }

  .no-flags{ padding:1.1rem 1.2rem; font-size:.85rem; color:var(--ok); }

  .csv-link{ font-size:.8rem; margin-bottom:1rem; }
  .csv-link a{ color:var(--accent); text-decoration:none; }
  .csv-link a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>Frame &amp; <span class="mark">Word</span></h1>
  <p>on-screen text QC — upload, we OCR every frame and flag the typos</p>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <p class="big">Drop video files here, or click to browse</p>
    <p class="small">MP4, MOV, MKV, AVI, WEBM — multiple files at once</p>
    <input type="file" id="fileInput" multiple accept=".mp4,.mov,.mkv,.avi,.webm,.m4v">
  </div>
  <div id="filelist"></div>

  <div class="options">
    <div class="field">
      <label>Review method</label>
      <select id="method">
        <option value="ocr">On-screen text (OCR)</option>
        <option value="srt">Subtitles / audio transcript (SRT)</option>
      </select>
    </div>
    <div class="field">
      <label>Sample rate (frames / second)</label>
      <input type="number" id="fps" value="1" min="0.2" max="5" step="0.2">
    </div>
  </div>

  <div class="options" id="srtRow" style="display:none">
    <div class="field">
      <label>SRT files (optional — filename must match video name; leave empty to auto-transcribe audio)</label>
      <input type="file" id="srtInput" multiple accept=".srt">
    </div>
    <div class="field">
      <label>Allow-list (one word per line — names, brands, jargon)</label>
      <textarea id="allowlist" placeholder="e.g.
Anthropic
Kazim"></textarea>
    </div>
  </div>
  <div class="options" id="allowlistRowOcr">
    <div class="field" style="grid-column:1 / -1">
      <label>Allow-list (one word per line — names, brands, jargon)</label>
      <textarea id="allowlistOcr" placeholder="e.g.
Anthropic
Kazim"></textarea>
    </div>
  </div>

  <button class="run" id="runBtn" disabled>Run QC</button>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <span id="progressLabel">Uploading… 0%</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="errorBox"></div>
  <div id="results"></div>

  <div class="section-title">History</div>
  <div id="historyList"></div>
</main>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filelist = document.getElementById('filelist');
const runBtn = document.getElementById('runBtn');
const results = document.getElementById('results');
const methodSelect = document.getElementById('method');
const srtRow = document.getElementById('srtRow');
const allowlistRowOcr = document.getElementById('allowlistRowOcr');
let selectedFiles = [];

methodSelect.addEventListener('change', () => {
  const isSrt = methodSelect.value === 'srt';
  srtRow.style.display = isSrt ? 'grid' : 'none';
  allowlistRowOcr.style.display = isSrt ? 'none' : 'grid';
});

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(fileArr){
  selectedFiles = Array.from(fileArr);
  filelist.innerHTML = selectedFiles.map(f =>
    `<div class="row"><span>${f.name}</span><span>${(f.size/1024/1024).toFixed(1)} MB</span></div>`
  ).join('');
  runBtn.disabled = selectedFiles.length === 0;
}

const progressWrap = document.getElementById('progressWrap');
const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');
const errorBox = document.getElementById('errorBox');

function showError(msg){
  errorBox.innerHTML = `<div class="error-box">${msg}</div>`;
}
function clearError(){ errorBox.innerHTML = ''; }

runBtn.addEventListener('click', () => {
  clearError();
  runBtn.disabled = true;
  progressWrap.style.display = 'block';
  progressLabel.textContent = 'Uploading… 0%';
  progressFill.style.width = '0%';

  const method = methodSelect.value;
  const fd = new FormData();
  selectedFiles.forEach(f => fd.append('videos', f));
  fd.append('fps', document.getElementById('fps').value);
  fd.append('method', method);

  if (method === 'srt') {
    fd.append('allowlist', document.getElementById('allowlist').value);
    const srtInput = document.getElementById('srtInput');
    Array.from(srtInput.files).forEach(f => fd.append('srt_files', f));
  } else {
    fd.append('allowlist', document.getElementById('allowlistOcr').value);
  }

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload');

  xhr.upload.addEventListener('progress', (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressLabel.textContent = `Uploading… ${pct}%`;
      progressFill.style.width = pct + '%';
    }
  });

  xhr.onload = () => {
    let data;
    try { data = JSON.parse(xhr.responseText); }
    catch (e) {
      showError(`Server returned an unexpected response (status ${xhr.status}). Check Railway deploy logs.`);
      runBtn.disabled = false;
      progressWrap.style.display = 'none';
      return;
    }
    if (xhr.status >= 400 || data.error) {
      showError(data.error || `Upload failed (status ${xhr.status})`);
      runBtn.disabled = false;
      progressWrap.style.display = 'none';
      return;
    }
    progressLabel.textContent = 'Processing…';
    progressFill.style.width = '100%';
    pollStatus(data.job_id);
  };

  xhr.onerror = () => {
    showError('Upload failed — network error or server crashed. Check Railway deploy logs.');
    runBtn.disabled = false;
    progressWrap.style.display = 'none';
  };

  xhr.send(fd);
});

function pollStatus(jobId){
  const interval = setInterval(async () => {
    try {
      const res = await fetch(`/status/${jobId}`);
      if (!res.ok) {
        clearInterval(interval);
        showError(`Status check failed (${res.status}). Check Railway deploy logs.`);
        runBtn.disabled = false;
        progressWrap.style.display = 'none';
        return;
      }
      const job = await res.json();
      renderResults(jobId, job);
      if (job.status === 'done') {
        clearInterval(interval);
        runBtn.disabled = false;
        progressWrap.style.display = 'none';
        loadHistory();
      }
    } catch (e) {
      clearInterval(interval);
      showError('Lost connection while checking status: ' + e.message);
      runBtn.disabled = false;
      progressWrap.style.display = 'none';
    }
  }, 2000);
}

const historyList = document.getElementById('historyList');

async function loadHistory(){
  try {
    const res = await fetch('/history');
    const items = await res.json();
    if (!items.length) {
      historyList.innerHTML = '<div class="history-empty">No videos processed yet.</div>';
      return;
    }
    historyList.innerHTML = items.map(item => `
      <div class="history-item">
        <div class="h-left">
          <span class="h-video">${item.video}</span>
          <span class="h-meta">${item.timestamp} — ${item.method === 'srt' ? 'subtitles/audio' : 'on-screen OCR'}</span>
        </div>
        <div style="display:flex; align-items:center; gap:1rem">
          <span class="h-flags">${item.flag_count} flagged</span>
          <a href="${item.csv_url}" download>CSV</a>
        </div>
      </div>
    `).join('');
  } catch (e) {
    historyList.innerHTML = '<div class="history-empty">Couldn\'t load history.</div>';
  }
}

loadHistory();

function renderResults(jobId, job){
  let html = `<div class="csv-link"><a href="/reports/${jobId}/report.csv" download>↓ download full CSV report</a></div>`;
  for (const [vname, vdata] of Object.entries(job.videos)) {
    html += `<div class="video-block">
      <div class="vhead">
        <span class="vname">${vname}</span>
        <span class="status-badge status-${vdata.status}">${vdata.status}</span>
      </div>`;
    if (vdata.status === 'done') {
      if (vdata.flags.length === 0) {
        html += `<div class="no-flags">no spelling issues flagged ✓</div>`;
      } else {
        vdata.flags.forEach(flag => {
          html += `<div class="flag">
            ${flag.thumb ? `<img src="${flag.thumb}">` : ''}
            <div class="flag-meta">
              <div class="flag-time">${flag.start} – ${flag.end}</div>
              <div class="flag-words">${flag.words.map(w => `<span>${w}</span>`).join('')}</div>
              <div class="flag-text">${flag.text}</div>
            </div>
          </div>`;
        });
      }
    } else if (vdata.status === 'error') {
      html += `<div class="no-flags" style="color:#a1341a">error: ${vdata.error || 'unknown'}</div>`;
    }
    html += `</div>`;
  }
  results.innerHTML = html;
}
</script>
</body>
</html>
